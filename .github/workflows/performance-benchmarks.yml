name: Performance Benchmarks

on:
  pull_request:
    branches:
      - main
    paths:
      - "homoglyphs_fork/**.py"
      - "tests/**.py"

permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Base Branch (Main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main

      - name: Checkout PR Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: main/.python-version
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Get Baseline Benchmark
        working-directory: main
        run: |
          uv sync --group dev
          uv run pytest tests/test_benchmarks.py --benchmark-min-rounds=100 --benchmark-json=../baseline.json
      - name: Compare with PR Benchmark
        working-directory: ${{ github.event.pull_request.head.sha }}
        run: |
          uv sync --group dev
          uv run pytest tests/test_benchmarks.py --benchmark-min-rounds=100 --benchmark-compare=../baseline.json --benchmark-compare-fail=mean:20%
