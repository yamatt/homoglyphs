name: Generate Confusables as PR

on:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  generate:
    name: Generate the confusables
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Generate confusables
        run: |
          uv run generate.py homoglyphs_fork/
      - name: Create Pull Request for changes
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          commit-message: "Latest confusables"
          title: "Latest confusables"
          body: "Automatically generated"
          assignees: |
            yamatt
          labels: |
            auto-update
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
