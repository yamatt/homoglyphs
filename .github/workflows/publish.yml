name: Publish

on:
  push:
    tags:
      - "v*" # Triggers on v1.0.0, v2.1.3, etc.

jobs:
  publish:
    name: Build and Release
    runs-on: ubuntu-latest

    # Trusted Publishing requires these specific permissions
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - name: Build Package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
