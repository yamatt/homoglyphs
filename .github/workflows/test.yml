name: Test

on:
  push:
    branches:
      - main
    paths:
      - "homoglyphs_fork/**"
      - " .github/workflows/*.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Run lint
        run: |
          uv run ruff check homoglyphs_fork/ tests/
      - name: Run SAST
        run: |
          uv run bandit -r homoglyphs_fork/
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      max-parallel: 4
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: "auto"
      - name: Test
        run: |
          uv run tests/test_homoglyphs.py
